workflows:
  ios_unsigned_build:
    name: iOS Unsigned Build
    max_build_duration: 60
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Show tool versions
        script: |
          flutter --version
          xcodebuild -version
      - name: Generate iOS project files
        script: |
          flutter create . --platforms=ios --org com.antigravity --project-name kinetic_hiit
      - name: Install Dart dependencies
        script: |
          flutter pub get
      - name: Generate code
        script: |
          dart run build_runner build --delete-conflicting-outputs
      - name: Install CocoaPods dependencies
        script: |
          cd ios
          pod install --repo-update
          cd ..
      - name: Prepare iOS build config
        script: |
          flutter build ios --release --no-codesign --config-only
      - name: Build unsigned Runner.app
        script: |
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos -destination generic/platform=iOS CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - name: Package unsigned IPA
        script: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r app-unsigned.ipa Payload
    artifacts:
      - build/ios/ipa/app-unsigned.ipa
      - build/ios/iphoneos/Runner.app/**
